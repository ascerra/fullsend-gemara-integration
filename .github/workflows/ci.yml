name: Integration checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify pinned dependencies
        run: |
          go mod download
          go mod verify
      - name: Scan complete Git history for credentials
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --no-banner .
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check formatting and implementation
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run paired fixture demonstrations
        run: |
          mkdir -p out
          go run ./cmd/gemara-owner demo
          go run ./cmd/gemara-owner demo --json > out/results.json
      - name: Validate official Gemara documents and native logs
        run: python3 scripts/validate_artifacts.py out/results.json
